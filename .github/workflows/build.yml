name: SonarCloud Monorepo

on:
  push:
    branches: [ develop, main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_ORG: blogdoft                    # <-- ajuste
  SONAR_PROJECT_KEY_BACKEND: blogdoft_code-review-insights-backend  # <-- ajuste
  SONAR_PROJECT_KEY_FRONTEND: blogdoft_code-review-insights-frontend # <-- ajuste

jobs:
  backend-sonar:
    name: Backend (.NET) - SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Requer JDK para o Scanner .NET
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      - name: Cache Sonar .NET scanner
        uses: actions/cache@v4
        with:
          path: ./backend/.sonar/scanner
          key: ${{ runner.os }}-sonar-dotnet-scanner
          restore-keys: ${{ runner.os }}-sonar-dotnet-scanner

      - name: Install SonarScanner for .NET
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Restore
        run: dotnet restore

      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /o:"$SONAR_ORG" \
            /k:"$SONAR_PROJECT_KEY_BACKEND" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/*.generated.cs" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (with coverage)
        run: |
          dotnet test --no-build --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat="opencover" \
            /p:CoverletOutput="TestResults/coverage/"

      - name: End Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  frontend-sonar:
    name: Frontend (Angular 19) - SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # Chrome para rodar testes em headless
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --if-present

      # Ajuste seu script "test" para headless (ex.: Karma com ChromeHeadless)
      - name: Test (with coverage)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npx ng test --watch=false --code-coverage --browsers=ChromeHeadless || true
          # Caso sua pipeline deva falhar sem testes, remova o "|| true".

      # Scanner do SonarCloud para JS/TS
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./frontend
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/dist/**,**/*.gen.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.tsconfigPath=tsconfig.json
